<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background: linear-gradient(135deg, #150f23 0%, #1f1633 100%); border-radius: 16px; font-family: 'Space Grotesk', system-ui, sans-serif;">
  <defs>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="60" text-anchor="middle" fill="#c2ef4e" font-size="30" font-weight="700" letter-spacing="1">🌐 CLOUD VIRTUAL NETWORK TOPOLOGY (VPC / VNet)</text>
  <text x="600" y="90" text-anchor="middle" fill="#bdb8c0" font-size="15">Isolation, Routing, Security Boundaries &amp; Multi-Tier Segregation</text>

  <!-- Outside Internet Zone -->
  <g transform="translate(60, 130)">
    <rect width="200" height="490" rx="14" fill="rgba(255,255,255,0.04)" stroke="#6a5fc1" stroke-width="1.5" />
    <text x="100" y="45" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">PUBLIC INTERNET</text>
    
    <!-- User icons -->
    <circle cx="100" cy="120" r="30" fill="#241a3f" stroke="#70a1ff" stroke-width="2" />
    <text x="100" y="128" text-anchor="middle" font-size="24">💻</text>
    <text x="100" y="175" text-anchor="middle" fill="#bdb8c0" font-size="13">Web Visitors</text>

    <circle cx="100" cy="240" r="30" fill="#241a3f" stroke="#c2ef4e" stroke-width="2" />
    <text x="100" y="248" text-anchor="middle" font-size="24">📱</text>
    <text x="100" y="295" text-anchor="middle" fill="#bdb8c0" font-size="13">Mobile Clients</text>

    <rect x="25" y="370" width="150" height="80" rx="10" fill="#1a122e" stroke="#fa7faa" stroke-width="1.5" />
    <text x="100" y="405" text-anchor="middle" fill="#fa7faa" font-size="14" font-weight="700">⚡ CDN EDGE</text>
    <text x="100" y="430" text-anchor="middle" fill="#bdb8c0" font-size="12">Cached Assets</text>
  </g>

  <!-- VPC Container -->
  <g transform="translate(300, 130)">
    <rect width="840" height="490" rx="16" fill="rgba(106, 95, 193, 0.06)" stroke="#c2ef4e" stroke-width="2" stroke-dasharray="6,6" />
    <text x="30" y="40" fill="#c2ef4e" font-size="18" font-weight="700">🏰 VIRTUAL PRIVATE CLOUD (VPC: 10.0.0.0/16)</text>

    <!-- Internet Gateway -->
    <rect x="30" y="65" width="190" height="45" rx="8" fill="#422082" stroke="#c2ef4e" stroke-width="1.5" />
    <text x="125" y="93" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">🚪 Internet Gateway (IGW)</text>

    <!-- Public Subnet Card -->
    <g transform="translate(30, 130)">
      <rect width="360" height="320" rx="12" fill="#1a122e" stroke="#2ed573" stroke-width="1.5" />
      <text x="20" y="35" fill="#2ed573" font-size="16" font-weight="700">🟢 Public Subnet (10.0.1.0/24)</text>
      <text x="20" y="55" fill="#bdb8c0" font-size="12">Direct route to Internet Gateway</text>

      <!-- Load Balancer -->
      <rect x="30" y="80" width="300" height="65" rx="8" fill="#241a3f" stroke="#70a1ff" stroke-width="1.5" />
      <text x="180" y="110" text-anchor="middle" fill="#70a1ff" font-size="14" font-weight="700">⚖️ Application Load Balancer</text>
      <text x="180" y="130" text-anchor="middle" fill="#bdb8c0" font-size="12">Public IP: 54.214.18.90</text>

      <!-- Web Servers -->
      <rect x="30" y="170" width="135" height="110" rx="8" fill="#1f1633" stroke="#e5e7eb" stroke-width="1" />
      <text x="97" y="200" text-anchor="middle" font-size="22">🖥️</text>
      <text x="97" y="230" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Web VM #1</text>
      <text x="97" y="255" text-anchor="middle" fill="#c2ef4e" font-size="11">10.0.1.10</text>

      <rect x="195" y="170" width="135" height="110" rx="8" fill="#1f1633" stroke="#e5e7eb" stroke-width="1" />
      <text x="262" y="200" text-anchor="middle" font-size="22">🖥️</text>
      <text x="262" y="230" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Web VM #2</text>
      <text x="262" y="255" text-anchor="middle" fill="#c2ef4e" font-size="11">10.0.1.11</text>
    </g>

    <!-- Network Security Firewall Divider -->
    <line x1="420" y1="130" x2="420" y2="450" stroke="#fa7faa" stroke-width="2" stroke-dasharray="4,4" />
    <text x="420" y="295" text-anchor="middle" fill="#fa7faa" font-size="11" font-weight="700" transform="rotate(-90, 420, 295)">🛡️ NSG FIREWALL RULE</text>

    <!-- Private Subnet Card -->
    <g transform="translate(450, 130)">
      <rect width="360" height="320" rx="12" fill="#1a122e" stroke="#ff4757" stroke-width="1.5" />
      <text x="20" y="35" fill="#ff4757" font-size="16" font-weight="700">🔒 Private Subnet (10.0.2.0/24)</text>
      <text x="20" y="55" fill="#bdb8c0" font-size="12">NO Internet Route • Internal Only</text>

      <!-- Database Servers -->
      <rect x="30" y="80" width="300" height="100" rx="8" fill="#241a3f" stroke="#fa7faa" stroke-width="1.5" />
      <text x="60" y="125" font-size="24">🗄️</text>
      <text x="180" y="115" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Primary SQL Database</text>
      <text x="180" y="140" text-anchor="middle" fill="#c2ef4e" font-size="12">Private IP: 10.0.2.50 (Port 3306)</text>
      <text x="180" y="160" text-anchor="middle" fill="#bdb8c0" font-size="11">Accessible only by Web VMs</text>

      <!-- Standby Replica -->
      <rect x="30" y="200" width="300" height="85" rx="8" fill="#1f1633" stroke="#362d59" stroke-width="1.5" />
      <text x="60" y="245" font-size="22">💾</text>
      <text x="180" y="235" text-anchor="middle" fill="#bdb8c0" font-size="13" font-weight="600">Standby Sync Replica</text>
      <text x="180" y="260" text-anchor="middle" fill="#79628c" font-size="11">Private IP: 10.0.2.51 (Failover)</text>
    </g>
  </g>
</svg>
